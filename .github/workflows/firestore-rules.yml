name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Firebase secrets
        id: secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID is not set. Skipping Firestore rules deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules
        if: steps.secrets.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          key_file="$(mktemp "${RUNNER_TEMP}/firebase-service-account.XXXXXX")"
          printf '%s\n' "$key_file" > "${RUNNER_TEMP}/firebase-key-path"
          chmod 600 "$key_file"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"
          npx -y firebase-tools@latest deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Delete service account key
        if: always()
        run: |
          set -euo pipefail
          path_file="${RUNNER_TEMP}/firebase-key-path"
          if [ -f "$path_file" ]; then
            key_file="$(tr -d '\n' < "$path_file")"
            if [ -n "$key_file" ]; then
              rm -f -- "$key_file"
            fi
            rm -f -- "$path_file"
          fi
