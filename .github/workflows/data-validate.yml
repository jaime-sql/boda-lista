name: data-validate

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/data/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data check dependencies
        run: python -m pip install -r tools/data/requirements.txt
      - name: Validate synthetic data pack
        run: python tools/data/validate.py
